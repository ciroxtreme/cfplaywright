name: Test Target via CFPlaywright

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL target"
        required: false
        default: "https://stockx.com"
  push:
    branches: [ main ]

jobs:
  run-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Official Chrome
        run: |
          pip install --no-cache-dir patchright requests pypasser numpy
          if ! command -v google-chrome &> /dev/null; then
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          fi
          echo "Chrome ready: $(google-chrome --version)"
          chmod +x bin/capture_cctv

      - name: Run CFPlaywright Target Test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          TARGET_URL="${{ github.event.inputs.target_url || 'https://stockx.com' }}"
          echo "Target URL: $TARGET_URL"
          xvfb-run -a python -u cfplaywright.py "$TARGET_URL"

      - name: Upload Snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-snapshot
          path: target_screenshot.png
          if-no-files-found: ignore
